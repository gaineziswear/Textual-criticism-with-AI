name: Philological Engine CI

on:
  push:
    branches:
      - philological-evidence-engine
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify-and-package:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
        run: |
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f -print -quit)"
          test -x "$SDKMANAGER"
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Create debug signing keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair               -keystore debug.keystore               -storepass android               -keypass android               -alias androiddebugkey               -keyalg RSA               -keysize 2048               -validity 10000               -dname "CN=Android Debug,O=Android,C=US"
          fi
          test -f debug.keystore

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Run philological engine tests
        run: |
          gradle :app:testDebugUnitTest --no-daemon --stacktrace             --tests com.example.engine.ArabicCandidateExtractorTest             --tests com.example.engine.PhilologicalClassificationEngineTest             --tests com.example.engine.PhilologicalEvidencePipelineTest

      - name: Assemble debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: glossa-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
